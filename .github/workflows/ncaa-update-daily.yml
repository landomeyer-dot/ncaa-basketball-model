
name: NCAA Daily Four Factors Update

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow requests

      - name: Generate NCAA statistics
        run: |
          python build_ncaa_four_factors_v3.py --season 2027

      - name: Save updated CSV files
        run: |
          cp ncaa_season_four_factors_2027.csv latest_season.csv
          cp ncaa_pregame_four_factors_2027.csv latest_pregame.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest_season.csv latest_pregame.csv
          if ! git diff --cached --quiet; then
            git commit -m "Update NCAA Four Factors statistics"
            git push
          fi
